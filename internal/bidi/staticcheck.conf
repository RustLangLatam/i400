# internal/bidi is a line-by-line port of JTOpen's Arabic shaping and bidi code.
# It keeps the unwired shaping options (U1000), the Java Yoda comparisons
# (ST1017), the Java do/while(false) idiom (SA4004) and escaped format
# characters in test strings (ST1018) so that it stays diffable against JTOpen.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-U1000", "-ST1017", "-ST1018", "-SA4004", "-SA9003"]
